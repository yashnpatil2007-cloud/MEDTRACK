services:
  postgres:
    image: postgres:16-alpine
    container_name: medtrack_postgres
    restart: always
    environment:
      POSTGRES_USER: medtrack_user
      POSTGRES_PASSWORD: medtrack_secure_password_2026
      POSTGRES_DB: medtrack_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtrack_user -d medtrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medtrack_backend
    restart: always
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://medtrack_user:medtrack_secure_password_2026@postgres:5432/medtrack_db
      - SECRET_KEY=medtrack-prod-secret-key-super-secure-2026
      - JWT_SECRET_KEY=medtrack-jwt-production-secret-token-2026
      - SUPERADMIN_ID=superadmin
      - SUPERADMIN_PASSWORD=SuperAdmin@MedTrack2026
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medtrack_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
